<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research architecture</title>
<style>
:root{--fg:#1d1d1f;--mut:#6e6e73;--bg:#fbfbf8;--card:#ffffff;--line:#c9c6be;
--orch:#0b5cad;--worker:#2f8f5b;--compute:#7a4fc0;--cf:#c8610e;--tg:#2a8bc4;--store:#555;--human:#1d1d1f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fg:#e8e6e1;--mut:#9a978f;--bg:#151514;--card:#1d1d1b;--line:#4a4844;
--orch:#7fb4ff;--worker:#6bd49a;--compute:#b99bff;--cf:#ff9a4d;--tg:#6cc3f0;--store:#bbb;--human:#e8e6e1}}
:root[data-theme="dark"]{--fg:#e8e6e1;--mut:#9a978f;--bg:#151514;--card:#1d1d1b;--line:#4a4844;
--orch:#7fb4ff;--worker:#6bd49a;--compute:#b99bff;--cf:#ff9a4d;--tg:#6cc3f0;--store:#bbb;--human:#e8e6e1}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font:14px/1.45 -apple-system,system-ui,sans-serif;padding:4px 0 8px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
svg{display:block;width:100%;min-width:640px;height:auto}
.grp{fill:none;stroke-width:1.2;stroke-dasharray:5 4;opacity:.8}
.glab{font:600 12px -apple-system,system-ui,sans-serif;letter-spacing:.02em}
.node rect{fill:var(--card);stroke-width:1.6}
.node.off rect{stroke-dasharray:5 4;opacity:.85}
.node.off text{opacity:.75}
.nt{font:600 13.5px -apple-system,system-ui,sans-serif;fill:var(--fg)}
.nl{font:12px -apple-system,system-ui,sans-serif;fill:var(--mut)}
.human rect{stroke:var(--human)}.tg rect{stroke:var(--tg)}.store rect{stroke:var(--store)}
.orch rect{stroke:var(--orch)}.worker rect{stroke:var(--worker)}.compute rect{stroke:var(--compute)}
.cf rect{stroke:var(--cf)}.tool rect{stroke:var(--line)}
.edge{fill:none;stroke:var(--mut);stroke-width:1.3}
.edge.dash{stroke-dasharray:4 4}
.ahead{fill:var(--mut)}
.elab{font:italic 11.5px -apple-system,system-ui,sans-serif;fill:var(--fg);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round}
.hint{font-size:12px;color:var(--mut);margin:6px 2px 0}
@media (min-width:640px){.hint{display:none}}
</style></head><body>
<div class="scroll"><svg viewBox="0 0 860 680" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">Architecture of the pdp research setup</title>
<desc id="d">Claude Code on a VPS orchestrates the grok and codex workers, which run experiments on Kaggle; results come back for verdicts, get committed to GitHub, published through a Cloudflare Tunnel, papers go to R2 and D1, and a daily Telegram message reports to Ez.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ahead"/></marker></defs>
<rect x="30" y="116" width="570" height="368" rx="12" class="grp" style="stroke:var(--orch)"/>
<text x="42" y="134" class="glab" style="fill:var(--orch)">VPS · the control room (2 cores, 3 GB RAM)</text>
<rect x="30" y="532" width="810" height="112" rx="12" class="grp" style="stroke:var(--cf)"/>
<text x="42" y="550" class="glab" style="fill:var(--cf)">Cloudflare</text>
<path d="M420,82 V140" class="edge" marker-end="url(#ah)"/>
<path d="M200,177 H240" class="edge" marker-end="url(#ah)"/>
<path d="M560,140 V100 H740 V82" class="edge" marker-end="url(#ah)"/>
<path d="M340,222 V262" class="edge" marker-end="url(#ah)"/>
<path d="M516,222 V262" class="edge dash" marker-end="url(#ah)"/>
<path d="M240,205 H212 V274 H200" class="edge" marker-end="url(#ah)"/>
<path d="M212,274 V354 H200" class="edge" marker-end="url(#ah)"/>
<path d="M50,274 H18 V51 H40" class="edge" marker-end="url(#ah)"/>
<path d="M240,51 H300" class="edge" marker-end="url(#ah)"/>
<path d="M240,298 H224 V434 H200" class="edge" marker-end="url(#ah)"/>
<path d="M330,334 V372 H620 V202 H640" class="edge" marker-end="url(#ah)"/>
<path d="M360,334 V418 H640" class="edge dash" marker-end="url(#ah)"/>
<path d="M740,296 V264" class="edge" marker-end="url(#ah)"/>
<path d="M50,354 H40 V591 H50" class="edge" marker-end="url(#ah)"/>
<path d="M125,462 V516 H440 V560" class="edge" marker-end="url(#ah)"/>
<path d="M440,516 H720 V560" class="edge" marker-end="url(#ah)"/>
<g class="node tg"><rect x="40" y="20" width="200" height="62" rx="9"/><text x="52" y="42" class="nt">Telegram bot</text>
<text x="52" y="60" class="nl">daily summary + usage bars</text>
</g>
<g class="node human"><rect x="300" y="20" width="200" height="62" rx="9"/><text x="312" y="42" class="nt">Ez</text>
<text x="312" y="60" class="nl">phone · laptop checkout</text>
</g>
<g class="node store"><rect x="640" y="20" width="200" height="62" rx="9"/><text x="652" y="42" class="nt">GitHub</text>
<text x="652" y="60" class="nl">pdp-continual (origin)</text>
</g>
<g class="node orch"><rect x="50" y="146" width="150" height="62" rx="9"/><text x="62" y="168" class="nt">Scheduled task</text>
<text x="62" y="186" class="nl">daily 08:40 UTC+8</text>
</g>
<g class="node tool"><rect x="50" y="246" width="150" height="56" rx="9"/><text x="62" y="268" class="nt">usage_report.py</text>
<text x="62" y="286" class="nl">daily Telegram report</text>
</g>
<g class="node tool"><rect x="50" y="326" width="150" height="56" rx="9"/><text x="62" y="348" class="nt">publish.sh</text>
<text x="62" y="366" class="nl">md → static site</text>
</g>
<g class="node tool"><rect x="50" y="406" width="150" height="56" rx="9"/><text x="62" y="428" class="nt">sync_papers.py</text>
<text x="62" y="446" class="nl">cf CLI → R2 + D1</text>
</g>
<g class="node orch"><rect x="240" y="140" width="340" height="82" rx="9"/><text x="252" y="162" class="nt">Claude Code · orchestrator</text>
<text x="252" y="180" class="nl">direction, specs with pre-registered bars,</text>
<text x="252" y="196" class="nl">review, verdicts, commits; writes no experiment code</text>
</g>
<g class="node worker"><rect x="240" y="262" width="200" height="72" rx="9"/><text x="252" y="284" class="nt">grok · default worker</text>
<text x="252" y="302" class="nl">implements and runs the spec,</text>
<text x="252" y="318" class="nl">writes results/*/RESULTS.md</text>
</g>
<g class="node worker off"><rect x="452" y="262" width="128" height="72" rx="9"/><text x="464" y="284" class="nt">codex CLI</text>
<text x="464" y="302" class="nl">sandboxed; capped</text>
<text x="464" y="318" class="nl">at 80%; off for now</text>
</g>
<g class="node compute"><rect x="640" y="140" width="200" height="124" rx="9"/><text x="652" y="162" class="nt">Kaggle · the runner</text>
<text x="652" y="180" class="nl">private kernels: 4 CPU, 32 GB,</text>
<text x="652" y="196" class="nl">Tesla T4 when needed;</text>
<text x="652" y="212" class="nl">code up as private datasets;</text>
<text x="652" y="228" class="nl">up to 3 kernels in parallel</text>
</g>
<g class="node compute"><rect x="640" y="296" width="200" height="56" rx="9"/><text x="652" y="318" class="nt">Kaggle datasets</text>
<text x="652" y="336" class="nl">real-data worlds (W1)</text>
</g>
<g class="node compute off"><rect x="640" y="390" width="200" height="56" rx="9"/><text x="652" y="412" class="nt">Colab CLI</text>
<text x="652" y="430" class="nl">optional GPU overflow</text>
</g>
<g class="node cf"><rect x="50" y="560" width="220" height="62" rx="9"/><text x="62" y="582" class="nt">Tunnel</text>
<text x="62" y="600" class="nl">serves learning.mywords.io</text>
</g>
<g class="node cf"><rect x="330" y="560" width="220" height="62" rx="9"/><text x="342" y="582" class="nt">R2 · pdp-papers</text>
<text x="342" y="600" class="nl">paper PDFs, private bucket</text>
</g>
<g class="node cf"><rect x="610" y="560" width="220" height="62" rx="9"/><text x="622" y="582" class="nt">D1 · pdp-papers-index</text>
<text x="622" y="600" class="nl">one row per paper we cite</text>
</g>
<text x="428" y="106" class="elab" text-anchor="start">direction</text>
<text x="650" y="96" class="elab" text-anchor="middle">commit, push</text>
<text x="348" y="246" class="elab" text-anchor="start">spec (handoff)</text>
<text x="500" y="366" class="elab" text-anchor="middle">push kernels ⇄ fetch results</text>
<text x="748" y="284" class="elab" text-anchor="start">data</text>
<text x="300" y="510" class="elab" text-anchor="middle">papers</text>
</svg></div>
<p class="hint">Swipe sideways to see the whole diagram.</p>
